name: CI Bench

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ========================================================================
  # Job 1: 性能指标测试 (release 实测 vs baseline 绝对预算)
  # ========================================================================
  benchmark:
    name: 性能基准测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.x 安装
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Rust 工具链 (rust-toolchain.toml 锁定)
        run: rustup toolchain install --no-self-update

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            other/target
          key: ${{ runner.os }}-bench-${{ hashFiles('host-tests/Cargo.toml', 'host-tests/Cargo.lock') }}

      - name: 检查 baseline.json 是否存在
        id: check-baseline
        run: |
          if [ -f host-tests/benches/baseline.json ]; then
            echo "has_baseline=true" >> $GITHUB_OUTPUT
          else
            echo "has_baseline=false" >> $GITHUB_OUTPUT
          fi

      - name: 记录初始基线 (首次)
        if: steps.check-baseline.outputs.has_baseline == 'false'
        run: |
          echo "baseline.json 不存在, 自动记录初始基线 (每项 5 次采样取中位)..."
          python3 scripts/record_bench_baseline.py --runs 5 2>&1 | tee other/build/log/bench_baseline_init.txt
          echo "已生成 baseline.json, 后续将进入性能指标判定模式"

      - name: 运行性能指标测试
        if: steps.check-baseline.outputs.has_baseline == 'true'
        run: |
          make -f Makefile.ci ci-bench 2>&1 | tee other/build/log/bench_perf.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::性能指标测试失败 (release 实测超 baseline 绝对预算)"
            cat other/build/log/bench_perf.txt
            exit 1
          fi
          echo "✅ 性能指标测试通过"

      - name: 上传基准报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: |
            other/build/log/bench_perf.txt
            other/build/log/bench_baseline_init.txt
            host-tests/benches/baseline.json
          retention-days: 30

  # ========================================================================
  # Job 2: 编译时间基准 (跟踪编译性能退化)
  # ========================================================================
  compile-time:
    name: 编译时间基准
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链 (rust-toolchain.toml 锁定)
        run: rustup toolchain install --no-self-update

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            other/target
          key: ${{ runner.os }}-compile-time-${{ hashFiles('src/rust/Cargo.toml', 'src/rust/Cargo.lock') }}

      - name: 测量编译时间
        working-directory: src/rust
        run: |
          echo "=== 编译时间测量 (x86_64) ==="
          START=$(date +%s%N)
          # 方案 D: 裸机 build 指向 kernel manifest; 方案 B: 注入 build-std
          cargo build --manifest-path ../kernel/Cargo.toml --release --config 'unstable.build-std=["core","compiler_builtins","alloc"]' --config 'unstable.build-std-features=["compiler-builtins-mem"]' --target x86_64-unknown-none --target-dir ../../other/target 2>&1 | tail -3
          END=$(date +%s%N)
          DURATION=$(( (END - START) / 1000000 ))
          echo "编译时间: ${DURATION}ms"
          echo "compile_time_ms=${DURATION}" >> $GITHUB_ENV

      - name: 记录编译时间
        run: |
          echo "| 架构 | 编译时间 (ms) | 日期 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| x86_64 | ${{ env.compile_time_ms }} | $(date -u +%Y-%m-%d) |" >> $GITHUB_STEP_SUMMARY
