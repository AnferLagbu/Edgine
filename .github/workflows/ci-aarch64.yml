name: CI aarch64

on:
  push:
    branches: [main, master, develop, feature/**]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ========================================================================
  # Job 1: cargo check (aarch64)
  # ========================================================================
  cargo-check-aarch64:
    name: cargo check (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链 (rust-toolchain.toml 锁定)
        run: rustup toolchain install --no-self-update

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            other/target
          key: ${{ runner.os }}-cargo-aarch64-${{ hashFiles('src/rust/Cargo.toml', 'src/rust/Cargo.lock') }}

      - name: cargo check
        working-directory: src/rust
        run: |
          # 方案 D: 裸机 check 指向 kernel manifest; 方案 B: 注入 build-std
          # B01-25 模式: 与 x86_64 同因 —— 本 job 无 mkdir 且 other/ 属 gitignore,
          # `| tee` 先失败使下方 grep 永不执行; 判据也从 `error\[` 收紧为真实退出码.
          mkdir -p ../../other/build/log
          set +e
          CHECK_OUT=$(cargo check --manifest-path ../kernel/Cargo.toml --config 'unstable.build-std=["core","compiler_builtins","alloc"]' --config 'unstable.build-std-features=["compiler-builtins-mem"]' --target aarch64-unknown-none-softfloat --target-dir ../../other/target 2>&1)
          CHECK_RC=$?
          set -e
          echo "$CHECK_OUT" | tee ../../other/build/log/cargo_check_aarch64.txt | tail -20
          if [ "$CHECK_RC" -ne 0 ]; then
            echo "::error::cargo check 失败 (RC=$CHECK_RC)"
            exit 1
          fi
          echo "✅ cargo check (aarch64) 通过"

  # ========================================================================
  # Job 2: aarch64 QEMU boot test
  # ========================================================================
  qemu-boot-aarch64:
    name: QEMU boot test (aarch64)
    runs-on: ubuntu-latest
    needs: cargo-check-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链 (rust-toolchain.toml 锁定)
        run: rustup toolchain install --no-self-update

      - name: 安装 QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm

      - name: 构建 aarch64 内核
        run: make ARCH=aarch64 all

      - name: QEMU boot test
        run: |
          bash scripts/qemu_boot_test.sh aarch64
