name: CI x86_64

on:
  push:
    branches: [main, master, develop, feature/**]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ========================================================================
  # Job 1: cargo check (x86_64)
  # ========================================================================
  cargo-check:
    name: cargo check (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链 (rust-toolchain.toml 锁定)
        run: rustup toolchain install --no-self-update

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            other/target
          key: ${{ runner.os }}-cargo-x86_64-${{ hashFiles('src/rust/Cargo.toml', 'src/rust/Cargo.lock') }}

      - name: cargo check
        working-directory: src/rust
        run: |
          # 方案 D: 裸机 check 指向 kernel manifest (queenx 壳仅 host); 方案 B: 注入 build-std
          cargo check --manifest-path ../kernel/Cargo.toml --config 'unstable.build-std=["core","compiler_builtins","alloc"]' --config 'unstable.build-std-features=["compiler-builtins-mem"]' --target x86_64-unknown-none --target-dir ../../other/target 2>&1 | tee ../../other/build/log/cargo_check.txt
          if grep -q "error\[" ../../other/build/log/cargo_check.txt; then
            echo "::error::cargo check 失败"
            exit 1
          fi

  # ========================================================================
  # Job 2: clippy -D unsafe-code (services 层 fail-fast)
  # ========================================================================
  clippy-no-unsafe-services:
    name: clippy -D unsafe-code (services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链 (rust-toolchain.toml 锁定)
        run: rustup toolchain install --no-self-update

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            other/target
          key: ${{ runner.os }}-clippy-x86_64-${{ hashFiles('src/rust/Cargo.toml', 'src/rust/Cargo.lock') }}

      - name: 静态断言 — services/ 所有 .rs 都有 #![deny(unsafe_code)]
        run: |
          missing=0
          for f in $(find src/kernel/services -name '*.rs'); do
            first_line=$(head -1 "$f")
            if ! echo "$first_line" | grep -q 'deny(unsafe_code)'; then
              echo "  ❌ $f 首行缺少 #![deny(unsafe_code)]: $first_line"
              missing=$((missing+1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "::error::共 $missing 个 services 文件未声明 #![deny(unsafe_code)]"
            exit 1
          fi
          echo "✅ 全部 services/ .rs 已声明 #![deny(unsafe_code)]"

      - name: cargo build (services 层编译期 unsafe 拦截)
        working-directory: src/rust
        run: |
          mkdir -p ../../other/build/log
          # 方案 D: 裸机 build 指向 kernel manifest; 方案 B: 注入 build-std
          cargo build --manifest-path ../kernel/Cargo.toml --config 'unstable.build-std=["core","compiler_builtins","alloc"]' --config 'unstable.build-std-features=["compiler-builtins-mem"]' --target x86_64-unknown-none --target-dir ../../other/target --lib 2>&1 | tee ../../other/build/log/build_services.txt | tail -5
          if grep -E "error.*unsafe|services/.*\.rs.*unsafe" ../../other/build/log/build_services.txt >/dev/null; then
            echo "::error::services 层检测到 unsafe 代码 (编译期 fail-fast 失败)"
            grep -E "error.*unsafe|services/.*\.rs" ../../other/build/log/build_services.txt | head -20
            exit 1
          fi
          echo "✅ services 层编译通过 (编译期 unsafe 拦截 OK)"

      - name: 上传编译报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-services-unsafe-report
          path: other/build/log/build_services.txt
          retention-days: 14

  # ========================================================================
  # Job 3: host-tests (单元 + 集成测试)
  # ========================================================================
  host-tests:
    name: host-tests (单元 + 集成)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链 (rust-toolchain.toml 锁定)
        run: rustup toolchain install --no-self-update

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            other/target
          key: ${{ runner.os }}-host-tests-${{ hashFiles('host-tests/Cargo.toml', 'host-tests/Cargo.lock') }}

      - name: 运行 host-tests
        working-directory: host-tests
        run: |
          cargo test 2>&1 | tee ../other/build/log/host_tests.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::host-tests 失败"
            exit 1
          fi
          echo "✅ host-tests 全部通过"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-tests-report
          path: other/build/log/host_tests.txt
          retention-days: 14

  # ========================================================================
  # Job 4: 内核 host 侧单元测试 (AGENTS.md §2.3 第 6 条门槛)
  # 源文件 `#[cfg(test)]` 内联用例: 由 cargo 自动发现, 无手工注册负担
  # (与 kernel_test 注册表轨并存, 见 docs/plan/kernel-unit-test-harness-unification.md).
  # target-dir 由 src/kernel/.cargo/config.toml 指向 other/target, 故缓存该目录.
  # 实测耗时: 冷编译约 20s + 运行约 20s.
  # ========================================================================
  kernel-host-tests:
    name: 内核单元测试 (host, §2.3-6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链 (rust-toolchain.toml 锁定)
        run: rustup toolchain install --no-self-update

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            other/target
          key: ${{ runner.os }}-kernel-host-tests-${{ hashFiles('src/rust/Cargo.toml', 'src/rust/Cargo.lock') }}

      - name: 运行内核 host 单元测试
        working-directory: src/kernel
        run: |
          mkdir -p ../../other/build/log
          # B01-25 模式: 捕获 cargo 真实退出码, 避免 `| tee` 管道退出码 fail-open.
          cargo test --features host-test --lib 2>&1 | tee ../../other/build/log/kernel_host_tests.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::内核 host 侧单元测试失败 (§2.3 第 6 条门槛)"
            exit 1
          fi
          echo "✅ 内核 host 侧单元测试全部通过"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-host-tests-report
          path: other/build/log/kernel_host_tests.txt
          retention-days: 14

  # ========================================================================
  # Job 5: clippy -D pedantic (DECISION-034)
  # 全 pedantic 强制 (除 cast_* DECISION-041); 防止 pedantic 警告回归
  # ========================================================================
  clippy-pedantic:
    name: clippy pedantic 强制 (除 cast_*)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链 (rust-toolchain.toml 锁定)
        run: rustup toolchain install --no-self-update

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            other/target
          key: ${{ runner.os }}-clippy-${{ hashFiles('src/rust/Cargo.toml', 'src/rust/Cargo.lock') }}

      - name: clippy -D pedantic (排除 cast_*)
        working-directory: src/rust
        run: |
          mkdir -p ../../other/build/log
          # 方案 D: clippy 指向 kernel manifest; 方案 B: 注入 build-std
          cargo clippy --manifest-path ../kernel/Cargo.toml --release --config 'unstable.build-std=["core","compiler_builtins","alloc"]' --config 'unstable.build-std-features=["compiler-builtins-mem"]' --target x86_64-unknown-none --target-dir ../../other/target --lib --bins --examples -- \
            -D clippy::pedantic \
            -A clippy::cast_possible_truncation \
            -A clippy::cast_sign_loss \
            -A clippy::cast_possible_wrap \
            -A clippy::cast_precision_loss \
            2>&1 | tee ../../other/build/log/clippy_pedantic.txt | tail -20
          if grep -qE "^error\[|^error:" ../../other/build/log/clippy_pedantic.txt; then
            echo "::error::clippy -D pedantic 失败"
            exit 1
          fi
          echo "✅ clippy -D pedantic 通过 (cast_* 已豁免, 见 DECISION-041)"

      - name: clippy aarch64 -D pedantic (排除 cast_*)
        working-directory: src/rust
        run: |
          mkdir -p ../../other/build/log
          # 方案 D: clippy 指向 kernel manifest; 方案 B: 注入 build-std
          cargo clippy --manifest-path ../kernel/Cargo.toml --release --config 'unstable.build-std=["core","compiler_builtins","alloc"]' --config 'unstable.build-std-features=["compiler-builtins-mem"]' --target aarch64-unknown-none-softfloat --target-dir ../../other/target --lib --bins --examples -- \
            -D clippy::pedantic \
            -A clippy::cast_possible_truncation \
            -A clippy::cast_sign_loss \
            -A clippy::cast_possible_wrap \
            -A clippy::cast_precision_loss \
            2>&1 | tee ../../other/build/log/clippy_pedantic_aarch64.txt | tail -20
          if grep -qE "^error\[|^error:" ../../other/build/log/clippy_pedantic_aarch64.txt; then
            echo "::error::clippy aarch64 -D pedantic 失败"
            exit 1
          fi
          echo "✅ clippy aarch64 -D pedantic 通过 (cast_* 已豁免, 见 DECISION-041)"

      - name: clippy kernel_test 维 -D pedantic (排除 cast_*, J-01/G-02)
        working-directory: .
        run: |
          mkdir -p other/build/log
          # J-01 (2026-09-08): kernel_test feature 门控代码 lint 纳入 CI —
          # host target 运行 (避开裸机 build.rs 产物检查), 覆盖 feature 维 lint 回归
          # 方案 D: 指向 kernel manifest
          cargo clippy --manifest-path src/kernel/Cargo.toml --features kernel_test --lib -- \
            -D warnings -D clippy::pedantic \
            -A clippy::cast_possible_truncation \
            -A clippy::cast_sign_loss \
            -A clippy::cast_possible_wrap \
            -A clippy::cast_precision_loss \
            2>&1 | tee other/build/log/clippy_pedantic_kernel_test.txt | tail -20
          if grep -qE "^error\[|^error:" other/build/log/clippy_pedantic_kernel_test.txt; then
            echo "::error::clippy kernel_test 维失败"
            exit 1
          fi
          echo "✅ clippy kernel_test 维通过 (host target, J-01)"

      - name: clippy host-test 维 -D pedantic (排除 cast_*, J-01/G-18)
        working-directory: .
        run: |
          mkdir -p other/build/log
          # J-01 (2026-09-08): host-test feature 门控代码 lint 纳入 CI —
          # host target 运行, 覆盖 E-03 同源双编译维度的 lint 回归
          # 方案 D: 指向 kernel manifest
          cargo clippy --manifest-path src/kernel/Cargo.toml --features host-test --lib -- \
            -D warnings -D clippy::pedantic \
            -A clippy::cast_possible_truncation \
            -A clippy::cast_sign_loss \
            -A clippy::cast_possible_wrap \
            -A clippy::cast_precision_loss \
            2>&1 | tee other/build/log/clippy_pedantic_host_test.txt | tail -20
          if grep -qE "^error\[|^error:" other/build/log/clippy_pedantic_host_test.txt; then
            echo "::error::clippy host-test 维失败"
            exit 1
          fi
          echo "✅ clippy host-test 维通过 (host target, J-01)"

      - name: cargo fmt --check 风格统一阻断 (全仓三 crate)
        working-directory: .
        run: |
          # 仓库根 rustfmt.toml / rust-toolchain.toml 为唯一来源; 三 crate 均纳入门禁,
          # 防止 kernel 之外 (host-tests / queenx 壳) 的格式漂移重新积累.
          for manifest in src/kernel/Cargo.toml host-tests/Cargo.toml src/rust/Cargo.toml; do
            echo "=== cargo fmt --check: ${manifest} ==="
            cargo fmt --manifest-path "${manifest}" -- --check
          done
          echo "✅ cargo fmt --check 通过 (kernel + host-tests + queenx 壳, rustfmt 风格统一)"

      - name: 上传 clippy 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-pedantic-report
          path: other/build/log/clippy_pedantic.txt
          retention-days: 14
