# 方案 D: kernel 独立 crate 统一 target-dir 到仓库级 other/target (与 edgine/CI/
# 审计共用同一 target 缓存). 避免 src/kernel/target 独立产物被 forbidden-patterns
# 等审计脚本误扫描 (target/ 下的依赖 probe.rs 含裸 asm). 构建时仍可用 --target-dir 覆盖.
# 与仓库根 .cargo/config.toml 的 target-dir 一致 (本文件更近, 优先级更高).
[build]
target-dir = "../../other/target"

# G-01/G-05 (2026-09-06 用户决策委托修复): 固化 curve25519-dalek 后端为 serial.
# 与 src/rust/.cargo/config.toml 同源 (kernel 独立后须各自声明): LLVM 22 对
# curve25519-dalek 5.0.0 SIMD/AVX2 后端 rustc SIGILL (信号 4); serial 后端全量
# 构建+链接通过. 官方支持 env 选择后端.
[env]
CARGO_CFG_CURVE25519_DALEK_BACKEND = "serial"

# A-12 丙 (2026-11-04 用户裁定): 内核镜像的裸机 rustflags 随本 crate 声明.
# 原先 -C relocation-model=static 只写在 src/rust/.cargo/config.toml, 而 cargo 按
# **当前工作目录向上**合并配置 (与 --manifest-path 无关) ⇒ `make` (cd src/kernel)
# 与 `./ci/build.sh` (pushd src/rust) 两条入口对同一棵树编出两种机器码 (GOTPCREL
# 23269 对 2008). 现在两条入口统一从 src/kernel 起 cargo, 该段即镜像的唯一 rustflags
# 来源; 三个三元组的取值必须与 src/rust 那份逐字一致 (由 host-tests 的
# kernel_build_entry_config_test.rs 对账, 防单源漂移).
[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-arg=-nostdlib",
]

[target.aarch64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-arg=-nostdlib",
]

[target.aarch64-unknown-none-softfloat]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-arg=-nostdlib",
]
