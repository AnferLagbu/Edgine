[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Edgine 内核本体 (framekernel 架构, x86_64 + aarch64) — 方案 D 独立 crate"
repository = "https://gitee.com/AnferLagbu/Edgine"
readme = "../../README.md"
keywords = ["kernel", "os", "framekernel", "no_std"]
categories = ["os", "no-std", "embedded"]

[lib]
name = "kernel"
path = "lib.rs"
# 方案 D: staticlib 供 Makefile 链接内核; rlib 供 edgine 壳依赖 (host-tests).
crate-type = ["staticlib", "rlib"]
# 原 `test = false` (DECISION-021 处置 E0152 双 core lang item 冲突) 已移除:
# 构建模式显式化后该冲突不再复现, 源文件 `#[cfg(test)]` 内联单元测试可直接由
# `cargo test --features host-test --lib` 执行. 详见
# docs/plan/kernel-unit-test-harness-unification.md.

[profile.dev]
panic = "abort"
lto = false

[profile.release]
panic = "abort"
lto = true
opt-level = "z"

# 调试专用 profile (与 edgine 原配置一致), 用于排查深水区问题.
[profile.test-debug]
inherits = "release"
lto = false
opt-level = 0
debug = 2

[dependencies]
# 方案 D: kernel 直接依赖 (从 edgine Cargo.toml 迁移, 仅 kernel 实际使用).
# zerocopy/ed25519-dalek 由 kernel 代码直接引用; bitflags 经 `bitflags::bitflags!`
# 宏调用 (mm/sgeg/cpu 等 7 文件); smoltcp 为 kernel 内部 vendored.
bitflags = "2.4"
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
# DECISION-078: 真实 Ed25519 签名验证 (RFC 8032). BSD-3-Clause OR Apache-2.0.
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }
smoltcp = { path = "functions/net/smoltcp", default-features = false, features = [
    "medium-ethernet",
    # 双栈地址池容量: link-local IPv6 + SLAAC 全局 IPv6 + DHCP IPv4 需 3 槽,
    # 默认容量 2 会致 DHCP IPv4 入池失败 → iface 无 IPv4 → 单播 SYN 被丢.
    # 取 4 留一档余量 (smoltcp 仅提供 2 的幂 feature, 故不能取 3).
    "iface-max-addr-count-4",
    "proto-ipv4",
    "proto-ipv4-fragmentation",
    "proto-ipv6",
    "proto-ipv6-slaac",
    "proto-dhcpv4",
    "proto-dns",
    "socket-raw",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-tcp-cubic",
    "socket-dhcpv4",
    "socket-dns",
    # P6a 联调: 由 smoltcp Interface 直接回显 ICMP/ICMPv6 EchoRequest, 无需上层 socket
    # (宿主机 ping/ping6 内核地址可被自动应答, 用于证明链路双向连通).
    "auto-icmp-echo-reply",
] }

# spin 仅在 x86_64 SMP 启动路径 (privileged/arch/x86_64/smp_init.rs) 使用,
# 声明为 x86_64 限定依赖, 消除 aarch64 构建的 cargo `unused_dependencies` 警告.
[target.'cfg(target_arch = "x86_64")'.dependencies]
spin = "0.9"

[features]
default = []
# e1000 真实硬件 EEPROM 读取路径 (关闭时走 QEMU 仿真兼容路径).
e1000-real-hw = []
e1000-verbose = []
# host-test: 剥离裸机专属顶层约束 (no_std/no_main/alloc_error_handler/panic_handler),
# 供 host-tests 经 edgine 壳引用 functions 真实源码.
host-test = []
kernel_test = []
fault_injection = []
smp = []
net = []
alloc = []
async = []
debug_mutex = []
# initramfs: 从 other/build/user/initramfs.cpio 加载根文件系统
initramfs = []
log = []
json_export = []
ipv6 = []
dhcp = []
http_client = []
mdns = []
mqtt = []
sntp = []
smtp = []
tftp = []
snmp = []
netbios = []
preempt = []
kaslr = []
freg = []
# syscall 入口诊断串口输出 (仅调试)
debug_syscall = []
