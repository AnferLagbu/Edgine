[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Edgine 内核本体 (framekernel 架构, x86_64 + aarch64) — 方案 D 独立 crate"
repository = "https://gitee.com/AnferLagbu/Edgine"
readme = "../../README.md"
keywords = ["kernel", "os", "framekernel", "no_std"]
categories = ["os", "no-std", "embedded"]

[lib]
name = "kernel"
path = "lib.rs"
# 方案 D: staticlib 供 Makefile 链接内核; rlib 供 edgine 壳依赖 (host-tests).
crate-type = ["staticlib", "rlib"]
# 原 `test = false` (DECISION-021 处置 E0152 双 core lang item 冲突) 已移除:
# 构建模式显式化后该冲突不再复现, 源文件 `#[cfg(test)]` 内联单元测试可直接由
# `cargo test --features host-test --lib` 执行. 详见
# docs/plan/archive/kernel-unit-test-harness-unification.md.

[profile.dev]
panic = "abort"
lto = false

[profile.release]
panic = "abort"
lto = true
opt-level = "z"

# 调试专用 profile (与 edgine 原配置一致), 用于排查深水区问题.
[profile.test-debug]
inherits = "release"
lto = false
opt-level = 0
debug = 2

[dependencies]
# P-71 crate 拆分: privileged 层独立 crate (唯一允许 unsafe 的 TCB),
# functions 层独立 crate (100% safe 业务). 本 crate 退化为 glue:
# 只持有启动/panic/分配器等裸机专属顶层约束与跨层测试, 并把两者重新导出为
# 同名模块 (`pub use kernel_privileged as privileged;` 等), 使既有
# `crate::privileged::…` / `crate::functions::…` 路径零改写.
# 原 kernel 直依赖 (edgine-abi / bitflags / zerocopy / ed25519-dalek / smoltcp)
# 已随代码分别归入这两个子 crate — 拆出后 glue 自身零引用, 保留会触发
# `unused_dependencies`.
kernel-privileged = { path = "privileged" }
kernel-functions = { path = "functions" }

# x86_64 SMP 启动路径的 `AP_STARTUP_LOCK` (`spin::mutex::SpinMutex`) 已依调用图调研
# 删除 (见 docs/plan/unresolved-issues-2026-08-09.md ISSUE-TOOL-004); 全仓已无任何
# `spin::` 代码引用, 故原 `[target.'cfg(target_arch = "x86_64")'.dependencies] spin`
# 声明一并移除 —— 内核同步原语统一由 privileged::sync (自研 IrqSpinLock/SpinLock) 提供.

[features]
default = []
# P-71: 两个子 crate 用到的 feature 必须逐项转发 (privileged / functions 各一组);
# 未转发的 feature 在子 crate 里恒为关闭, 会让其 cfg 分支静默消失.
# e1000 真实硬件 EEPROM 读取路径 (关闭时走 QEMU 仿真兼容路径) — 使用点在 functions.
e1000-real-hw = ["kernel-functions/e1000-real-hw"]
# S2 DNS 接线 (docs/plan/archive/net-feature-alignment.md): 实机验证钩子 —— boot 完成后发一次
# 真实 DNS 查询并 printk 结果 (仿 lockdep 诊断 feature 先例,
# 经 KERNEL_FEATURES= 点亮, 日常构建不含).
dns-selftest = ["kernel-privileged/dns-selftest"]
# host-test: 剥离裸机专属顶层约束 (no_std/no_main/alloc_error_handler/panic_handler),
# 供 host-tests 经 edgine 壳引用 functions 真实源码.
host-test = ["kernel-privileged/host-test", "kernel-functions/host-test"]
kernel_test = ["kernel-privileged/kernel_test", "kernel-functions/kernel_test"]
fault_injection = ["kernel-privileged/fault_injection"]
smp = ["kernel-privileged/smp"]
net = ["kernel-privileged/net"]
alloc = ["kernel-privileged/alloc"]
async = ["kernel-functions/async"]
debug_mutex = ["kernel-privileged/debug_mutex"]
# lockdep: 独立点亮锁依赖检测体系 (AB-BA / IRQ 取睡眠锁 / 递归 / 释放未持有),
# 使 release boot 镜像也能在其余仍为 release 的前提下单独启用锁序取证.
# 详见 docs/plan/multithreading-project.md A-1..A-4 与 P-29 根因诊断.
lockdep = ["kernel-privileged/lockdep"]
# initramfs: 从 other/build/x86_64/user/initramfs.cpio 加载根文件系统 (产物按架构分目录)
initramfs = ["kernel-functions/initramfs"]
log = ["kernel-privileged/log"]
json_export = ["kernel-privileged/json_export"]
preempt = ["kernel-privileged/preempt"]
kaslr = ["kernel-privileged/kaslr"]
freg = ["kernel-privileged/freg"]
# syscall 入口诊断串口输出 (仅调试)
debug_syscall = ["kernel-privileged/debug_syscall"]

[workspace]
# P-71: src/kernel 由「单 crate」变为「glue + privileged + functions」工作区.
# 根 package 仍是 kernel (staticlib 产物名不变, Makefile 无需改动).
# `functions` 不写进 members: 它是 root package 的 path 依赖, cargo 会自动把它纳入
# workspace 成员 (--workspace / -p kernel-functions 均可见). 反之若显式列入 members,
# 其目录内的 vendored smoltcp 会因「显式成员目录内的 path 依赖不受 exclude 约束」
# 而被强行拉成成员, 触发其 manifest 里 [[example]] 指向已被 vendor 脚本裁掉的文件
# 而解析失败 (实测: members=["privileged","functions"] + exclude 仍解析 smoltcp).
# privileged 是纯目录成员, 无此问题, 故显式列出.
members = ["privileged"]
exclude = ["functions/net/smoltcp"]
resolver = "3"
