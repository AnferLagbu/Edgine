# Clippy configuration for Edgine kernel
# Enforce strict safety and code quality standards
#
# 适用: Edgine Framekernel (Rust no_std 内核, 裸机)
# 内核风格: 文档化所有公开 API, 强制 SAFETY 注释紧邻 unsafe 块。

# ── 内核风格阈值 ──────────────────────────────────────────────
# Cognitive complexity limit - keep functions understandable
cognitive-complexity-threshold = 25

# Type complexity limit
type-complexity-threshold = 250

# Function body length limit
too-many-lines-threshold = 100

# Avoid large types passed by value
# 旧名 trivially-copy-pass-by-ref-threshold 已弃用, 改为 trivial-copy-size-limit
trivial-copy-size-limit = 16

# ── 文档要求 ──────────────────────────────────────────────────
# 内核风格: 文档化所有公开 API
missing-docs-in-crate-items = true

# 抑制部分对 no_std 内核不适用的 lint
# (内核导出 API 时可自由重构, 不应触发稳定化警告)
avoid-breaking-exported-api = false

# ── 标准宏 ────────────────────────────────────────────────────
# 格式: { name = "宏名", brace = "<单个字符>" }, 字符为左/右配对中的"开括号"
# 配对规则: () → ( ; [] → [ ; {} → { ; <> → <
standard-macro-braces = [
    { name = "klog_pmm", brace = "(" },
    { name = "klog_slab", brace = "(" },
    { name = "klog_error", brace = "(" },
]

# ── 禁用类型 (I-16 OnceCell 抽象统一) ─────────────────────────
# 判据: 项目代码不得绕过自研一次性原语, 直接用第三方 `spin::Once` / `spin::OnceCell`.
# 唯一允许入口: `crate::functions::sync::once::{Once, OnceCell}` (后者是
# `privileged::sync::once_lock::OnceLock<T>` 的类型别名).
# 路径必须 **crate 名绝对**: `crate::spin::Once` 形态不命中 (实测).
# 射程: spin 已从本 workspace 依赖移除 (见 Cargo.toml 内注释), Cargo.lock 零 spin
# ⇒ 本条目当前**射程为空**, 属「防线在位」, 将来重新引入 spin 即刻生效.
# 生效性已实测 (门禁健康度收敛工程批 2): 临时登记仓内真实类型后, 既命中真实使用点
# (privileged 78 处), 也命中 functions 内「只 `use` 不使用」的导入, RC=101
# ⇒ 本文件确被内核腿读到、该键确生效.
# 但 spin 两条目本身**未验证命中**: 注入 `use spin::Once;` 会先报 unresolved import
# (spin 已非本 workspace 依赖), 走不到本 lint.
disallowed-types = ["spin::Once", "spin::OnceCell"]
